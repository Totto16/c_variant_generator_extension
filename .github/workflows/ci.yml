name: Test CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Build package
        run: |
          npm clean-install -D
          npm run package
          npm run test

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VSIX
          path: c-variants-file-support-*.vsix
